/* "About evenly" means every sample's share of its group's weighted mean is within EVEN_TOL of an equal

/* ---------- step 1: fold change ---------- */
function foldSVG() {
  const idx = CMP; if (!idx.length) return '';
  const W = 420, H = 230, L = 46, R = 12, T = 14, Bm = 40;
  const vals = []; idx.forEach(i => { if (isNum(P.prot[i])) { vals.push(P.prot[i] - (P.se[i] || 0)); vals.push(P.prot[i] + (P.se[i] || 0)); } });
  if (!vals.length) return '';
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const pad = (hi - lo) * 0.12 + 0.1, y0 = lo - pad, y1 = hi + pad;
  const Y = v => T + (H - T - Bm) * (1 - (v - y0) / (y1 - y0));
  const gx = {}; gx[DEN] = L + (W - L - R) * 0.28; gx[NUM] = L + (W - L - R) * 0.72;
  const nIn = g => idx.filter(i => G[i] === g).length;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Protein value in each sample of the comparison">';
  const step = [0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 5].find(x => (y1 - y0) / x <= 5) || 10, dec = step < 0.1 ? 2 : step < 1 ? (step === 0.25 ? 2 : 1) : 0;
  for (let k = Math.ceil(y0 / step); k * step <= y1; k++) { const v = k * step;
    s += '<line class="qt-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="qt-lab" x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + v.toFixed(dec) + '</text>'; }
  s += '<text class="qt-lab" transform="translate(12,' + ((T + H - Bm) / 2) + ') rotate(-90)" text-anchor="middle">protein value (log2)</text>';
  const cnt = {};
  idx.forEach(i => {
    const g = G[i], n = nIn(g), k = (cnt[g] = (cnt[g] || 0) + 1) - 1, sp = Math.min(34, 140 / Math.max(1, n));
    const x = gx[g] + (k - (n - 1) / 2) * sp, v = P.prot[i], inf = inferred(i), sel = i === st.s, c = inf ? 'var(--inf)' : GCOL(g);
    if (!isNum(v)) return;
    s += '<g class="qt-hit" data-s="' + i + '">';
    if (sel) s += '<circle cx="' + x + '" cy="' + Y(v) + '" r="11" fill="none" stroke="var(--accent)" stroke-width="2"/>';
    s += '<line x1="' + x + '" x2="' + x + '" y1="' + Y(v - P.se[i]) + '" y2="' + Y(v + P.se[i]) + '" stroke="' + c + '" stroke-width="2"/>';
    s += '<line x1="' + (x - 5) + '" x2="' + (x + 5) + '" y1="' + Y(v - P.se[i]) + '" y2="' + Y(v - P.se[i]) + '" stroke="' + c + '" stroke-width="2"/>';
    s += '<line x1="' + (x - 5) + '" x2="' + (x + 5) + '" y1="' + Y(v + P.se[i]) + '" y2="' + Y(v + P.se[i]) + '" stroke="' + c + '" stroke-width="2"/>';
    s += inf ? '<circle cx="' + x + '" cy="' + Y(v) + '" r="6" fill="var(--bg-secondary)" stroke="var(--inf)" stroke-width="2.5"/>' : '<circle cx="' + x + '" cy="' + Y(v) + '" r="6" fill="' + c + '"/>';
    s += '<rect x="' + (x - Math.max(6, sp / 2)) + '" y="' + T + '" width="' + Math.max(12, sp) + '" height="' + (H - T - Bm) + '" fill="transparent"><title>' + esc(SHORT[i]) + ' (' + esc(S[i]) + '): ' + f2(v) + '</title></rect></g>';
  });
  [DEN, NUM].forEach(g => s += '<text class="qt-labs" x="' + gx[g] + '" y="' + (H - 14) + '" text-anchor="middle" style="fill:' + GCOL(g) + '">' + esc(clip(g, 22)) + '</text>');
  if (idx.some(inferred)) s += '<circle cx="' + (W - R - 128) + '" cy="' + (T + 6) + '" r="5" fill="var(--bg-secondary)" stroke="var(--inf)" stroke-width="2.5"/><text class="qt-lab" x="' + (W - R - 119) + '" y="' + (T + 10) + '" style="fill:var(--inf);font-weight:700">inferred (0 found)</text>';
  return s + '</svg>';
}

function limmaWeightsHTML() {
  const R = RT;
  const rows = ORD.map(i => '<tr><td style="color:' + GTXT(G[i]) + ';font-weight:600">' + esc(SHORT[i]) + '</td><td class="mono">' + f2(P.prot[i]) + '</td><td class="mono">±' + f2(P.se[i]) + '</td><td>' +
    (inferred(i) ? '<span style="color:var(--inf);font-weight:700">inferred</span>' : NOBS[i] + ' found') + '</td><td>' +
    (R.wshare && isNum(R.wshare[i]) ? '<span class="qt-qbar"><i style="width:' + Math.round(R.wshare[i] * 100) + '%"></i></span><b>' + Math.round(R.wshare[i] * 100) + '%</b> of the ' + esc(G[i]) + ' mean' : '—') +
    (INC(i) ? '' : ' <span class="note">(not in this comparison)</span>') + '</td></tr>').join('');
  return '<div class="qt-second"><h4>How limma uses limpa’s information</h4>' +

  const grp = (title, items) => '<h4>' + title + '</h4><dl class="grid">' + items.filter(Boolean).join('') + '</dl>';
  const files = uniq([FILES.report, FILES.stats, FILES.session_rds, FILES.de_table, 'tables/de_provenance.json', 'tables/set_test_inputs.rds', 'screen_data/manifest.json'].filter(Boolean)).map(esc).join(', ');
  return '<div class="qt-explain" id="qt-explain"><h3>How to read this page</h3>' +
    '<p>Every term on this page, in plain words, with where it comes from. A protein’s number is made in three stages: DIA-NN reports precursors in each sample, limpa turns them into one protein value per sample, and limma compares the groups.</p>' +
    grp('1. The search (DIA-NN)', [
      item('Peptide and precursor', 'A peptide is an amino-acid sequence. A precursor is that peptide at one charge state (2+, 3+); DIA-NN quantifies precursors, so one peptide can give two or three.', 'DIA-NN report'),
      item('Found / not found', '<i>Found</i>: DIA-NN reported a value for the precursor in that sample that passed the analysis’s confidence checks. <i>Not found</i>: it reported no such value. Only protein values are ever called <i>inferred</i>.', 'wording agreed for this screen'),
      item('Match-between-runs', 'When a search uses it, DIA-NN looks for every precursor of one shared library in every sample, so <i>not found</i> means it looked and nothing passed. The skill’s DIA-NN searches build that library from all the samples. This screen data does not record the search’s settings; the search’s own record (search/search_provenance.json) does.', 'DIA-NN README; the skill’s search (diann_parallel.py)'),
      QCOLS.length ? item('Confidence checks (q-values)', 'Each check is an estimated false-discovery rate. This analysis applied ' + QCOLS.length + ': ' + QCOLS.map(k => esc(k) + ' (' + esc(qlab(k)) + ') at ' + pct(CUT[k])).join(', ') + '. A precursor value over any cutoff is not used.', 'DIA-NN README; this project’s de_provenance.json') : '',
      item('QuantUMS', 'DIA-NN’s method for turning a precursor’s fragment-ion signals and its MS1 signal into one number. It weights each signal by how noisy it looks, using an error model learned from the data. The weights are not reported.', 'Grossmann, Kistner … Demichev, Nat Biotechnol 2026, Supplement pp. 8–11'),
      item('Quality score', 'QuantUMS’s confidence in a precursor’s number: 1 / (1 + its estimated error SD), from 0 to 1. DIA-NN recommends it for filtering. limpa does not use it. ' + quantumsFilterTxt(), 'DIA-NN README; this project’s de_provenance.json (filters_applied)'),
      item('Normalisation factor', 'DIA-NN multiplies each precursor’s raw quantity by a factor to even out loading between runs: normalised = factor × raw. The factor differs from precursor to precursor within a run.' + (A.normalisation ? ' This analysis: ' + esc(A.normalisation) + '.' : ''), 'DIA-NN README; this project’s de_provenance.json'),
      HAS_XIC ? item('XIC (chromatogram)', 'The signal of each fragment ion and of the MS1 precursor over retention time, around the peak. Tall, smooth peaks that rise and fall together are what a trustworthy value looks like.', 'DIA-NN --xic files') : ''
    ]) +
    grp('2. From precursors to a protein value (limpa)', [
      item('DPC-Quant', 'limpa’s method. On the log scale, each precursor value is modelled as the protein’s level in that sample plus the precursor’s own offset. Every found value counts equally: “all precursors, in fact all observations, are weighted equally by default”.', 'limpa paper (Li, Cobbold &amp; Smyth, bioRxiv 2025) p.17; limpa 1.4.0 code, peptides2ProteinBFGS'),
      HAS_DPC ? item('Detection curve (DPC)', 'One curve for the whole experiment: the chance a precursor is found at a given intensity. Here it is found half the time at ' + Y50.toFixed(1) + (isNum(REF) ? ' and ' + Math.round(pFound(REF) * 100) + '% of the time at ' + REF.toFixed(1) + ', the middle of this protein’s found values' : '') + '. It is fitted from precursor-level data.', 'Li &amp; Smyth, Bioinformatics 2023; this analysis’s dpc_fit') : '',
      item('Gaps', 'A precursor not found in a sample is not dropped and not filled in. limpa reads it as “probably low”: the chance of missing it, from the detection curve. Gaps carry far less information than found values.', 'limpa code; Li &amp; Smyth 2023 §3.8'),
      item('Detection chance', 'Per precursor, per sample. For a found value: the chance a precursor at that intensity is found, read off the curve. This is descriptive: limpa’s fit uses found values only as values, and uses the curve only for gaps. For a gap: the chance of being found that limpa’s fit used, from the level it expects for that precursor there. A gap where the chance was high is surprising and pulls the value down.', 'our calculation with limpa’s own fit (make_screen_data.R); limpa code (peptides2ProteinBFGS: the missing-value term)'),
      item('Inferred', 'A protein value in a sample where none of its precursors was found. It rests on the detection curve, the protein’s values in other samples and limpa’s starting assumptions, and gets a wide error bar.', 'limpa (n.observations = 0)'),
      isNum(h['prior.mean']) ? item('Starting assumptions', 'Two gentle pulls that limpa sets from this dataset: a typical protein level of ' + f1(h['prior.mean']) + ' (±' + f1(h['prior.sd']) + ') and sample-to-sample changes of about ±' + f1(h['prior.logFC']) + ' log2.', 'limpa paper p.24 (empirical Bayes); this analysis’s y_protein') : '',
      item('Error bar (±)', 'limpa’s standard error for each protein value. Few found precursors, or none, means a wider bar.', 'limpa (standard.error)'),
      item('Shares', 'How much of a sample’s protein value rests on each precursor’s value: ' + shareMethodText() + '. limpa doesn’t report them. They depend on how many precursors were found, not on intensity.', 'our calculation with limpa (make_screen_data.R; screen_data/manifest.json, shares)')
    ]) +
    grp('3. The change (limma)', [
      item('log2 fold change', '+1 means twice as high in ' + esc(NUM) + ' as in ' + esc(DEN) + ', −1 half as high. limma fits it from the protein values of the two groups.', esc(FILES.de_table) + ' (logFC)'),
      item('Weights', 'limma doesn’t treat the values equally. vooma fits a trend of each protein’s spread against its average level and limpa’s error bars; each value’s weight is 1 / (its predicted SD)⁴. A wide error bar, such as an inferred value’s, means less weight. If a whole group is inferred, limpa also leaves those values out of the protein’s variance estimate.', 'limpa code: dpcDE, voomaLmFitWithImputation; weights from the delivered fit'),
      item('Adjusted p', 'The p-value corrected for testing many proteins at once (Benjamini–Hochberg across the ' + loc(D.n_tested) + ' proteins tested in ' + esc(VS) + '). Below ' + ADJP + ' puts a protein in the changed list' + (NOFC ? '; no fold-change filter is applied' : '') + '.', 'this project’s de_provenance.json (adjp' + (A.significance_rule ? ', significance_rule: “' + esc(A.significance_rule) + '”' : '') + ')')
    ]) +
    grp('4. Checks and flags', [
      item('⚠ Look closer', 'The value rests on inferred samples, a peptide used is shared with other proteins, or a sample’s normalisation was unstable. These flags stay on this screen. A flag says the answer depends on the method or the data, not that it is wrong.', 'this screen'),
      item('Shared peptide', 'A peptide that DIA-NN also assigns to other proteins in the searched database. Its signal may partly belong to them.', 'DIA-NN report (Protein.Ids, Proteotypic)'),
      Object.keys(STATS).length ? item('Sample health', 'Per run: precursors and proteins identified; normalisation instability (a DIA-NN stats-file measure the README does not define; the skill warns at 0.3); and MS1 mass error before → after DIA-NN’s own correction.', 'DIA-NN ' + esc(FILES.stats)) : ''
    ]) +
    '<h4>Sources</h4><ul class="refs">' +
    '<li>DIA-NN README, github.com/vdemichev/DiaNN (report column definitions, QuantUMS, match-between-runs)</li>' +
    '<li>Grossmann JL, Kistner F, … Demichev V. Accurate quantification in proteomics with QuantUMS. Nat Biotechnol 2026. doi:10.1038/s41587-026-03131-2</li>' +
    '<li>Li M, Cobbold SA, Smyth GK. bioRxiv 2025. doi:10.1101/2025.04.28.651125 (limpa and DPC-Quant)</li>' +
    '<li>Li M, Smyth GK. Bioinformatics 2023;39(5):btad200, PMC10174703 (the detection probability curve)</li>' +
    '<li>limpa source code (dpcQuant, peptides2ProteinBFGS, dpcDE); limma (voomaLmFitWithImputation)</li>' +
    '<li>This project’s files: ' + files + '</li></ul></div>';
}

function step(n, title, tool, body, foot, id, na) {
  return '<div class="qt-step' + (na ? ' na' : '') + '" id="' + id + '"><div class="hd"><div class="n">' + n + '</div><h3>' + title + '</h3><span class="tool">' + tool + '</span></div>' +
    '<div class="bd">' + body + '</div><div class="ft">' + foot + '</div></div>';
}

function render() {
  let h = askHTML() + cardHTML() + storyHTML() + howItWorksHTML() + pathHTML() + step1HTML() + step2HTML() + step3HTML() + step4HTML() + reportHTML() + explainHTML();
  h += '<p class="qt-foot">Built by make_protein_screen.py from screen_data/ (' + esc(PROV.written_by) + ', ' + esc(day(PROV.written_at)) + ')' +
    ((PROV.verified || []).length ? '; checksums verified for ' + (PROV.verified || []).map(esc).join(', ') : '') +
    ((PROV.not_checked || []).length ? '; not checked here (not beside the screen data): ' + (PROV.not_checked || []).map(esc).join(', ') : '') + '.</p>';
  document.getElementById('qt').innerHTML = h;
}

document.title = GENE + ': where its number comes from';
document.getElementById('qt-title').textContent = GENE + ': where its number comes from';
document.getElementById('qt-sub').innerHTML = 'Comparison <b>' + esc(VS) + '</b> (' + esc(FILES.de_table) + ')' + (CT.default === true ? ' · ' + DEFAULT_CMP : '') + ' · ' + esc(A.display_label || '') + ' · protein group ' + esc(PG) +
  ' · ' + plural(N, 'sample') + ' in ' + plural(GROUPS.length, 'group') + ' · screen data written ' + esc(day(PROV.written_at));

document.getElementById('qt').addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-s],[data-p],[data-go]');
  if (!t) return;
  const act = t.dataset.act;
  if (act && act.indexOf('det:') === 0) { const k = act.slice(4); st.open[k] = !st.open[k]; }
  else if (act && act.indexOf('open:') === 0) { const k = act.slice(5); st.open[k] = true; render(); const el = document.getElementById('det-' + k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  else if (act === 'xshared') st.xshared = true;
  else if (act === 'xown') st.xshared = false;
  else if (act === 'skw-share') st.skw = 'share';
  else if (act === 'skw-int') st.skw = 'int';
  else if (act === 'skw-count') st.skw = 'count';
  else if (t.dataset.s != null) st.s = +t.dataset.s;
  else if (t.dataset.p) st.p = t.dataset.p;
  else if (t.dataset.go) { const el = document.getElementById(t.dataset.go); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  render();
});
try {
  const hp = new URLSearchParams((location.hash || '').slice(1));
  if (hp.get('s') != null && hp.get('s') !== '') { const v = +hp.get('s'); if (v >= 0 && v < N) st.s = v; }
  if (hp.get('p') && allPrec().indexOf(hp.get('p')) >= 0) st.p = hp.get('p');
  (hp.get('open') || '').split(',').filter(Boolean).forEach(k => { st.open[k] = true; });
  if (hp.get('theme') === 'dark' || hp.get('theme') === 'light') document.documentElement.dataset.theme = hp.get('theme');
} catch (e) { /* a malformed #hash keeps the defaults */ }
render();
document.body.dataset.render = 'ok';
})();
</script>
</body>
</html>

name: Sync to Hugging Face

on:
  push:
    branches:
      - main
    # A push that touches ONLY these paths does not rebuild the Space: none of them is read
    # by the app at run time (the skill, docs, Cascadia notes, tests, the GitHub-only READMEs
    # and changelog, and these workflows). A push that also touches app files still syncs.
    # `workflow_dispatch` below forces a sync by hand.
    paths-ignore:
      - 'README.md'
      - 'README_GITHUB.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'skill/**'
      - '.claude-plugin/**'
      - 'docs/**'
      - 'cascadia/**'
      - 'tests/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          path: github-repo
          fetch-depth: 0

      - name: Checkout HF repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://brettphinney:$HF_TOKEN@huggingface.co/spaces/brettsp/de-limp-proteomics hf-repo

      - name: Sync files to HF
        run: |
          cd hf-repo

          # Copy app files only (exclude dev/test artifacts)
          rsync -av --checksum --exclude='.git' --exclude='README.md' --exclude='.github' --exclude='tests' --exclude='docs/specs' --exclude='*_SPEC*.md' --exclude='CORE_FACILITY_PHASE2_SPEC.md' --exclude='NAV_RESTRUCTURE_SPEC.md' ../github-repo/ ./

          # Use HF README
          cp README_HF.md README.md

      - name: Commit and push to HF
        run: |
          cd hf-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-sync from GitHub (commit ${{ github.sha }})" || echo "No changes to commit"
          git push origin main

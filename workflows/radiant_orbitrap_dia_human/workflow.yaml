# =============================================================================
# Workflow: Radiant DIA + Fulcrum Pipeline, Thermo Orbitrap, human.
#
# The third DIA route, alongside DIA-NN and FragPipe. Radiant DIA is Seer's
# peptide-centric DIA search engine; on its own it produces only basic IDs, so it is
# run inside the Fulcrum Pipeline, which adds rescoring, FDR estimation, protein
# inference and directLFQ rollup.
#
# THERMO ONLY, and that is a property of THIS CONTAINER rather than of Radiant: the
# packaged search backend (radiant_fulcrum_search) accepts mzML or Parquet, so .raw
# is converted with msconvert first and Bruker .d is refused outright. (Radiant's
# source does contain an ion-mobility module, but it is not reachable through this
# container's CLI.)
#
# ⚠ NOT YET VALIDATED on facility data — see `validated:`.
# ⚠ LICENCE-RESTRICTED beyond the usual academic terms — see notes.
# =============================================================================
id: radiant_orbitrap_dia_human
name: "Radiant DIA + Fulcrum — Thermo Orbitrap (human)"
description: >
  Peptide-centric DIA search with Seer's Radiant DIA inside the Fulcrum Pipeline,
  run from the seerbio/radiant-fulcrum container. Thermo Orbitrap only: .raw is
  converted to mzML first and Bruker .d is refused. Radiant always needs a spectral
  library, which the skill generates with DIA-NN's predictor — Radiant reads
  DIA-NN's library TSV schema natively.

match:
  acquisition: DIA
  instruments: ["Orbitrap Astral", "Orbitrap Exploris 480", "Orbitrap Eclipse",
                "Orbitrap Fusion Lumos", "Q Exactive HF-X", "Orbitrap Exploris 240"]
  instrument_aliases: ["astral", "exploris", "orbitrap", "lumos", "eclipse", "q exactive"]
  organism: "Homo sapiens"
  organism_taxid: 9606
  # Hard requirement, not a preference: the container cannot read Bruker .d at all.
  instrument_required: true

engine:
  name: radiant
  version: "2.3.3"                          # container release, NOT the Radiant DIA version

fasta:
  uniprot_proteome: UP000005640
  add_contaminants: true

search:
  # The container's own shipped default, copied verbatim from
  # radiant_fulcrum_workflow 0.3.3 (data/default.radiantConfig).
  params_file: default.radiantConfig
  estimate_params: false

de:
  method: dpc
  input_note: >
    radiant_to_delimp.py output — precursor-level. adapt_radiant's report.parquet is
    protein-level and only supports maxlfq.
  q_cutoff: 0.01
  logfc: 1.0                                # volcano reference line only; not a filter
  adjp: 0.05

validated:
  date: ""
  by: ""
  dataset: ""
  notes: >
    NOT VALIDATED. default.radiantConfig is the container's own shipped default,
    copied unmodified — 20 ppm MS1/MS2 extraction, which suits Orbitrap generally but
    has not been tuned for Astral's narrow isolation windows. No facility dataset has
    been run through this route yet. The first run IS the validation run: compare it
    against the DIA-NN route on the same files with compare_searches.py and record the
    outcome here before treating this as a site SOP.

notes:
  - "LICENCE — read before any fee-for-service use. Apache-2.0 as modified by a MANDATORY GRANT-BACK and the COMMONS CLAUSE. The Commons Clause removes the right to 'Sell', which it defines to include selling a service whose value derives substantially from the software. That reads on core-facility fee-for-service work. Refer to https://github.com/seerbio/radiant-fulcrum-container/blob/main/LICENSE.md and UC Davis licensing; the skill flags it and does not rule on it."
  - "THERMO ONLY: radiant_fulcrum_search.search documents its input as 'the local path of the mzML or Parquet file(s) to search'. run_search.py refuses .d with a pointer to the DIA-NN or diaTracer route."
  - "A SPECTRAL LIBRARY IS ALWAYS REQUIRED. --library is required=True. The --libfree flag is a MISNOMER: in the click definition it is the same switch as --no-mbr ('--mbr/--no-mbr', '--no-libfree/--libfree'), so it selects single-pass vs match-between-runs and has nothing to do with running without a library."
  - "The library is generated with DIA-NN's predictor (--fasta-search --predictor --gen-spec-lib --out-lib *.tsv). Radiant's FragLibTsvReader takes DIA-NN's schema directly — its test fixture header is DIA-NN's report-lib.tsv columns verbatim (FileName, PrecursorMz, ProductMz, Tr_recalibrated, LibraryIntensity, transition_group_id, ModifiedPeptide, ...). So this route ALSO requires DIA-NN to be acquired."
  - "SERIAL BY DEFAULT: the search backend raises NotImplementedError('TODO: parallel processing') for anything but mode='serial'. On a cluster the skill works around this with radiant_parallel.py — per-file SLURM array, then ONE Fulcrum job with [overrides.search] reuse_existing=true, which makes _execute_radiant() return the existing <name>.radiantDIA instead of re-searching."
  - "OUTPUT: Fulcrum's 'combined' backend writes DIA-NN-style column names (Run, Protein.Group, PG.Quantity, PG.Normalised, Q.Value, Global.PG.Q.Value) but as a SPARK PARQUET DIRECTORY of part-files at <results>/fulcrum-results, not a single file. adapt_radiant reads it as a dataset and collapses PSM-level rows to protein x run."
  - "CONTAINER ONLY — Seer ships no native binary. Multi-arch (linux/amd64 + linux/arm64), so it runs natively on Apple Silicon and on x86 clusters. ~3 GB, so acquire_tools.sh only fetches it when pinned or ACQUIRE_RADIANT=1."
  - "On HIVE, build the .sif ON A COMPUTE NODE, never the login node: srun -c 8 --mem 16G --pty apptainer build radiant-fulcrum-<ver>.sif docker://seerbio/radiant-fulcrum:<ver>"
  - "The engine version pinned above is the CONTAINER release (github.com/seerbio/radiant-fulcrum-container/releases), which is not the same as the Radiant DIA version inside it. Record both when reporting."

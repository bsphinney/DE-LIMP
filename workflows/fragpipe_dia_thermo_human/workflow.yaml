# =============================================================================
# Workflow: FragPipe DIA, Thermo Orbitrap, human.
#
# The THERMO half of FragPipe's DIA support. It is a genuinely different route from
# fragpipe_diatracer_timstof_dia_human, not the same one with a flag flipped:
#
#   Bruker  .d  -> diaTracer traces 3-D (m/z, RT, ion mobility) features and writes
#                  pseudo-MS/MS spectra, which MSFragger then searches.
#   Thermo .raw -> there is no ion-mobility dimension to trace and no pseudo-spectra
#                  step. MSFragger-DIA searches the DIA spectra directly.
#
# diaTracer therefore has NO role here and FragPipe's own Thermo preset switches it
# off (diatracer.run-diatracer=false). Diffing the two presets shows the difference
# is much wider than that one key — see notes.
#
# ⚠ NOT YET VALIDATED on facility data — see `validated:`.
# =============================================================================
id: fragpipe_dia_thermo_human
name: "FragPipe DIA — Thermo Orbitrap (human)"
description: >
  FragPipe's DIA route for Thermo Orbitrap data: MSFragger-DIA searches the DIA
  spectra directly to build a spectral library, then DIA-NN extracts quantification
  against it. This is NOT the diaTracer route — diaTracer is for Bruker dia-PASEF
  and is disabled in this preset. Use it as a cross-check on the DIA-NN and
  Radiant routes on Orbitrap data.

match:
  acquisition: DIA
  instruments: ["Orbitrap Astral", "Orbitrap Exploris 480", "Orbitrap Eclipse",
                "Orbitrap Fusion Lumos", "Q Exactive HF-X", "Orbitrap Exploris 240"]
  instrument_aliases: ["astral", "exploris", "orbitrap", "lumos", "eclipse", "q exactive"]
  organism: "Homo sapiens"
  organism_taxid: 9606
  # Hardware-specific, not hardware-preferring: running the Thermo preset on Bruker
  # .d would search dia-PASEF data with diaTracer off and Orbitrap tolerances.
  instrument_required: true

engine:
  name: fragpipe
  version: "24.0"

fasta:
  uniprot_proteome: UP000005640
  add_contaminants: true

search:
  # FragPipe 24.0's own bundled DIA_SpecLib_Quant preset, copied verbatim from
  # Nesvilab/FragPipe@master so the pinned parameters travel with the workflow.
  params_file: DIA_SpecLib_Quant.workflow
  estimate_params: false

de:
  method: dpc
  input_note: >
    dia-quant-output/report.tsv (--format tsv) — FragPipe's DIA route bundles DIA-NN,
    so that file is precursor-level and limpa reads it. NOT the adapted report.parquet.
  q_cutoff: 0.01
  logfc: 1.0                                # volcano reference line only; not a filter
  adjp: 0.05

validated:
  date: ""
  by: ""
  dataset: ""
  notes: >
    NOT VALIDATED. Parameters are FragPipe 24.0's own bundled DIA_SpecLib_Quant
    preset, copied unmodified. No facility dataset has been run through this route
    yet. The first run IS the validation run: compare it against the DIA-NN and
    Radiant routes on the same files with compare_searches.py and record the outcome
    here before treating this as a site SOP.

notes:
  - "Preset is FragPipe 24.0 workflows/DIA_SpecLib_Quant.workflow, copied verbatim. Its counterpart DIA_SpecLib_Quant_diaPASEF.workflow is the Bruker one."
  - "The two presets are NOT interchangeable by flipping diatracer.run-diatracer. Diffed against FragPipe@master, they also differ in: ionquant.mbr (0 here vs 1), ionquant.minisotopes (1 vs 2), msfragger.allowed_missed_cleavage (1 vs 2), precursor-charge-lo (2 vs 1), precursor mass tolerance (+/-20 ppm vs +/-10), use_topN_peaks (1000 vs 300), and the variable-mod table (no SILAC entries here)."
  - "No pseudo-MS/MS conversion step, so none of the diaTracer operational hazards apply: no writing next to the raw files, no '.d' in a parent directory name, no per-file conversion budget."
  - "Same output contract as the diaTracer route: FragPipe bundles DIA-NN 1.8.2 Beta 8, which writes <workdir>/dia-quant-output/report.tsv, not parquet. adapt_fragpipe handles either."
  - "Bundled DIA-NN 1.8.2 Beta 8 is TWO MAJORS older than the 2.x the diann_* workflows pin. Say so when comparing — some of any difference is version, not approach."
  - "LICENSING: the gate is MSFragger/IonQuant (one shared academic licence; commercial via fragmatics.com). The bundled DIA-NN is explicitly available for academic AND commercial use within FragPipe, so it is not the restriction. Fee-for-service work for industry clients reads on the academic licence's work-product clause — refer to info@fragmatics.com and UC Davis licensing; do not rule on it in the skill."
  - "Install cannot be scripted: the gated jars come from a web form + licence key. Set FRAGPIPE_TOOLS_FOLDER to the folder that ALSO contains speclib/."

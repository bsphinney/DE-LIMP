# =============================================================================
# Workflow: FragPipe + diaTracer, Bruker timsTOF dia-PASEF, human.
#
# The second DIA route for timsTOF data, alongside diann_timstof_dia_mouse.
# Its point is that it is *spectrum-centric*: diaTracer traces 3-D (m/z, RT, ion
# mobility) features and emits pseudo-MS/MS spectra, which MSFragger searches as
# though they were DDA. That builds a spectral library from the data itself, and
# DIA-NN then extracts quantification against it. Because the identification step
# is a normal database search, this route reaches searches DIA-NN's own library-free
# mode does not do well: semi-tryptic, nonspecific/HLA, open/mass-offset PTM work.
#
# Everything below is verified against FragPipe 24.0 and the diaTracer repo, not
# assumed. See notes for the source of each pinned value.
#
# ⚠ NOT YET VALIDATED on facility data — see `validated:`. Treat the first run as
# the validation run and compare it against the DIA-NN route with compare_searches.py.
# =============================================================================
id: fragpipe_diatracer_timstof_dia_human
name: "FragPipe + diaTracer — Bruker timsTOF dia-PASEF (human)"
description: >
  Spectrum-centric DIA analysis of human dia-PASEF data. diaTracer converts each
  .d into pseudo-MS/MS spectra, MSFragger searches them to build a spectral
  library directly from the data, and DIA-NN extracts quantification against that
  library. Use it as a cross-check on the DIA-NN library-free route, or when the
  search needs semi-tryptic / nonspecific / open-modification behaviour.

match:
  acquisition: DIA
  instruments: ["timsTOF HT", "timsTOF Pro", "timsTOF Pro 2", "timsTOF SCP", "timsTOF Ultra"]
  instrument_aliases: ["timstof", "tims"]   # lowercase substrings vs the detected name
  organism: "Homo sapiens"
  organism_taxid: 9606                      # hard filter
  # diaTracer is Bruker-only: it converts dia-PASEF .d into pseudo-MS/MS.
  # Drop this bundle for non-timsTOF hardware rather than merely down-scoring it.
  instrument_required: true

engine:
  name: fragpipe
  version: "24.0"                           # released 2025-12-24; requires diaTracer 2.2.1+

fasta:
  uniprot_proteome: UP000005640             # human reference proteome
  add_contaminants: true

search:
  # FragPipe is configured by a .workflow preset, not by estimate_params.py (which
  # only knows diann and sage). This is FragPipe 24.0's own bundled diaPASEF preset,
  # copied verbatim so the pinned parameters travel with the workflow.
  params_file: DIA_SpecLib_Quant_diaPASEF.workflow
  estimate_params: false

de:
  method: dpc
  input_note: >
    dia-quant-output/report.tsv (--format tsv) — FragPipe's DIA route bundles DIA-NN,
    so that file is precursor-level and limpa reads it. NOT the adapted report.parquet.
  q_cutoff: 0.01
  logfc: 1.0                                # volcano reference line only; not a filter
  adjp: 0.05

validated:
  date: ""
  by: ""
  dataset: ""
  notes: >
    NOT VALIDATED. Parameters are FragPipe 24.0's own bundled diaPASEF preset and the
    pipeline wiring is verified against FragPipe source, but no facility dataset has
    been run through this route yet. The first run IS the validation run: compare it
    against the DIA-NN route on the same files with compare_searches.py and record the
    outcome here before treating this as a site SOP.

notes:
  - "Preset is FragPipe 24.0 workflows/DIA_SpecLib_Quant_diaPASEF.workflow, copied verbatim (diatracer.run-diatracer=true). Plain DIA_SpecLib_Quant has diatracer OFF — it is the Orbitrap/mzML path, not this one."
  - "Pipeline: .d -> diaTracer pseudo-MS/MS mzML -> MSFragger (DDA mode) -> MSBooster -> Percolator -> Philosopher -> EasyPQP library -> DIA-NN quant vs the original .d -> IonQuant."
  - "OUTPUT IS report.tsv, NOT parquet. FragPipe bundles DIA-NN 1.8.2 Beta 8, which writes <workdir>/dia-quant-output/report.tsv (+ report.pg_matrix.tsv, MSstats.csv). report.parquet appears ONLY if someone configures DIA-NN 2.x. adapt_fragpipe handles either."
  - "combined_protein.tsv also appears (IonQuant on the pseudo-spectra) — do NOT use it as the quant of record; it is not equivalent to the DIA-NN numbers and the paper never uses it."
  - "Bundled DIA-NN 1.8.2 Beta 8 is OLDER than the 2.x the diann_* workflows pin. Expect different numbers from that alone, independent of the spectrum-centric approach."
  - "WRITABLE RAW DIR REQUIRED: the pseudo-MS/MS mzML is written next to each .d file, not into --workdir. A read-only mount fails. Also never put '.d' in a parent directory name — FragPipe's path rewrite replaces every occurrence and mangles it."
  - "Manifest data type must be exactly DIA. An unrecognized value is SILENTLY treated as DDA (InputLcmsFile.java default branch), turning a DIA run into a DDA one with no error. DIA-Quant is quantify-only and does not trigger diaTracer."
  - "LICENSING: the gate is MSFragger/IonQuant/diaTracer (one shared academic licence; commercial via fragmatics.com). The bundled DIA-NN is explicitly 'available for both academic and commercial use within FragPipe', so DIA-NN is NOT the restriction — never tell a commercial user this route is closed to them."
  - "CORE-FACILITY RISK: the academic licence forbids 'any work product, report or deliverable by LICENSEE, for a commercial or for-profit organization', which reads on fee-for-service work for industry clients. Refer such questions to info@fragmatics.com and UC Davis licensing; do not rule on it in the skill."
  - "Install cannot be scripted: the three gated jars come from a web form + licence key. acquire_tools.sh can fetch FragPipe itself but never them — set FRAGPIPE_TOOLS_FOLDER."
  - "Runtime ~19.4 min per .d for diaTracer alone (paper: 34 files, 32 cores, 128 GB), plus ~87 min for the rest of the cohort. The mzML are reusable, so a re-search skips conversion. No GPU needed. Budget sbatch --mem generously; real OOMs are reported."
  - "Cite: K. Li et al., diaTracer enables spectrum-centric analysis of diaPASEF proteomics data, Nat Commun 16, 95 (2025)."
